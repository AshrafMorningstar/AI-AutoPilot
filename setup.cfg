[metadata]
name = ai-autopilot
version = 1.0.0
description = Zero-Click AI Agent AutoPilot: Automatic OmniRoute failover for all IDEs and coding agents
long_description = file: README.md
long_description_content_type = text/markdown
author = AS Projects
license = MIT
keywords = ai, llm, autopilot, omniroute, failover, claude, openai, gemini, coding-agent, vscode, automation
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Software Development :: Libraries
    Topic :: Scientific/Engineering :: Artificial Intelligence
project_urls =
    Homepage = https://github.com/AS-Projects/AI-AutoPilot
    Bug Reports = https://github.com/AS-Projects/AI-AutoPilot/issues
    Source = https://github.com/AS-Projects/AI-AutoPilot

[options]
packages = find:
python_requires = >=3.8
install_requires =

[options.entry_points]
console_scripts =
    autopilot = autopilot:main
